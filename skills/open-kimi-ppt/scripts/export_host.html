<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Kimi PPT Local Export</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }

      #status {
        position: fixed;
        z-index: 10;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 6px;
        background: rgb(0 0 0 / 72%);
        color: white;
        font: 12px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status">starting</div>
    <iframe id="editor" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
    <script type="module">
      import {
        i as connect,
        r as WindowMessenger,
      } from "https://statics.moonshot.cn/neo-design/assets/penpal-C4NjirZE.js";

      const status = document.querySelector("#status");
      const frame = document.querySelector("#editor");
      const editorOrigin = "https://www.kimi.com";

      const setStatus = (value) => {
        status.textContent = value;
        document.documentElement.dataset.deckStatus = value;
      };

      const normalizePath = (value) => {
        if (typeof value !== "string") return "";
        if (/^(?:data:image\/|https?:\/\/|blob:)/i.test(value)) return value;
        let candidate = value.replace(/^file:\/\/+/, "").replaceAll("\\", "/");
        try {
          candidate = decodeURIComponent(candidate);
        } catch {
          // Preserve literal percent signs.
        }
        const parts = [];
        for (const part of candidate.split("/")) {
          if (!part || part === ".") continue;
          if (part === "..") parts.pop();
          else parts.push(part);
        }
        return parts.join("/");
      };

      const resolveImage = (requestedPath, imageMap) => {
        if (/^(?:data:image\/|https?:\/\/|blob:)/i.test(requestedPath || "")) {
          return requestedPath;
        }
        const normalized = normalizePath(requestedPath);
        if (imageMap[normalized]) return imageMap[normalized];
        const suffix = Object.keys(imageMap).find(
          (path) => normalized.endsWith(`/${path}`) || path.endsWith(`/${normalized}`),
        );
        return suffix ? imageMap[suffix] : "";
      };

      try {
        // 宿主侧导出（可选）：?hostExport=1 时把 PPTX 交给宿主产出，编辑器仅渲染。
        const bootstrap = new URLSearchParams(location.search);
        const hostExport = bootstrap.get("hostExport") === "1";
        const hostPptxUrl = hostExport
          ? new URL(bootstrap.get("pptx") || "./deck.pptx", location.href).href
          : null;
        const liveRender = hostExport && bootstrap.get("render") === "1";
        let latestSave = null;

        async function fetchStaticDeck() {
          const response = await fetch(hostPptxUrl, { cache: "no-store" });
          if (!response.ok) throw new Error(`host PPTX HTTP ${response.status}`);
          const blob = await response.blob();
          if (!blob.size) throw new Error("host PPTX is empty");
          return { artifact: blob, pageCount: (payload.pages || []).length };
        }

        async function renderLiveDeck() {
          const deck = latestSave || {
            files: [
              { path: payload.manifestPath, content: payload.manifestContent },
              ...(payload.pages || []),
            ],
            title: payload.title,
          };
          const response = await fetch("./render-pptx", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "X-Render-Token": payload.renderToken || "",
            },
            body: JSON.stringify(deck),
          });
          if (!response.ok) throw new Error(`live render HTTP ${response.status}`);
          const blob = await response.blob();
          if (!blob.size) throw new Error("live render returned no bytes");
          const pageCount = Number(response.headers.get("X-Render-Pages"));
          if (!Number.isInteger(pageCount) || pageCount < 1) throw new Error("invalid live render page count");
          return { artifact: blob, pageCount };
        }

        const payload = await fetch("./payload.json", { cache: "no-store" }).then((response) => {
          if (!response.ok) throw new Error(`payload HTTP ${response.status}`);
          return response.json();
        });

        const query = new URLSearchParams({
          sdkMode: "ppt-editor",
          pptPlatform: "open-kimi-ppt-local-export",
          functional: JSON.stringify({
            fullscreen: false,
            present: false,
            export: true,
            close: false,
            annotation: false,
            feedback: false,
            share: false,
            versionHistory: false,
          }),
          sdkSaveMode: "external",
          sdkImageMode: "external",
          ...(hostExport ? { sdkExportMode: "external" } : {}),
        });

        frame.addEventListener(
          "load",
          async () => {
            setStatus("iframe-loaded");
            try {
              const messenger = new WindowMessenger({
                remoteWindow: frame.contentWindow,
                allowedOrigins: [editorOrigin],
              });
              const connection = connect({
                messenger,
                methods: {
                  close() {},
                  reenter() {},
                  toggleFullScreen(value) {
                    return value;
                  },
                  showFeedback() {},
                  sendPrompt() {},
                  showMessage() {},
                  hideMessage() {},
                  ...(hostExport
                    ? {
                        async handleExport() {
                          // Live mode re-renders the editor's latest autosave through the
                          // host backend; fixed mode hands back the pre-rendered file.
                          const { artifact, pageCount } = liveRender ? await renderLiveDeck() : await fetchStaticDeck();
                          // Pass the bytes through RPC so the remote iframe does not
                          // need permission to fetch a localhost URL.
                          const downloadUrl = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => reject(new Error("could not read host PPTX"));
                            reader.readAsDataURL(artifact);
                          });
                          return {
                            downloadUrl,
                            sizeBytes: artifact.size,
                            pageCount,
                            reused: false,
                            checkFailReason: "",
                          };
                        },
                      }
                    : {}),
                  onSave(savePayload) {
                    if (liveRender && Array.isArray(savePayload?.fileContent)) {
                      latestSave = {
                        files: savePayload.fileContent,
                        title: savePayload.title || payload.title,
                      };
                      status.textContent = "已接收最新编辑内容，导出将反映当前页面";
                    }
                    return {
                      fileContent: savePayload?.fileContent,
                      lastModifiedTime: Date.now(),
                    };
                  },
                  getImages(imagePayload = {}) {
                    const paths = Array.isArray(imagePayload.filePath) ? imagePayload.filePath : [];
                    return paths.map((path) => resolveImage(path, payload.imageMap || {}));
                  },
                  setAnnotationMode() {},
                  setAnnotationCurrentPage() {},
                  upsertAnnotation() {},
                  removeAnnotation() {},
                  clearAnnotations() {},
                },
              });

              const remote = await connection.promise;
              window.exportRemote = remote;
              await remote.setSlideConfig({
                editable: true,
                locale: "zh-CN",
                theme: "light",
                slideId: payload.id,
              });
              await remote.setPPTD(payload.id, {
                pptdContent: payload.manifestContent,
                pages: payload.pages,
                pptdPath: payload.manifestPath,
                basePath: "",
                isCreate: true,
              });
              await remote.setEditable(true);
              window.exportSlideStatus = await remote.getSlideStatus();
              setStatus("ready");
              if (hostExport) {
                status.textContent = liveRender
                  ? "导出将反映编辑器中的最新内容"
                  : "宿主导出下载预先生成的文件；页面编辑不会更新该文件";
              }
            } catch (error) {
              window.exportHostError = String(error?.stack || error);
              setStatus("error");
            }
          },
          { once: true },
        );

        frame.src = `${editorOrigin}/neo-ppt/?${query}`;
      } catch (error) {
        window.exportHostError = String(error?.stack || error);
        setStatus("error");
      }
    </script>
  </body>
</html>
