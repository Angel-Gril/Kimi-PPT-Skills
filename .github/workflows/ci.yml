name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r skills/open-kimi-ppt/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q skills/open-kimi-ppt/scripts skills/open-kimi-ppt/tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s skills/open-kimi-ppt/tests -p "test_*.py"
      - name: Scan for sensitive data
        run: python scripts/check_sensitive.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate npm package contents
        run: node scripts/check_package.mjs
